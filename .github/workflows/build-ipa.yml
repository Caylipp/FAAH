name: Build IPA
on:
  push:
    branches: [claude/faah-soundboard-app-x8gnv5, main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project FAAH.xcodeproj -scheme FAAH -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/FAAH.app Payload/
          zip -qr FAAH.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FAAH-ipa
          path: FAAH.ipa
